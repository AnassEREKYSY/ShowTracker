# Sites for the VM's reverse-proxy container (/opt/nginx/conf.d/showtracker.conf).
# Names are resolved at request time through Docker's DNS, so redeploys (new container IPs)
# never cause 502s and the proxy still starts when ShowTracker is down.

server {
    listen 443 ssl;
    server_name showtracker.anasserekysy.com;

    ssl_certificate /etc/letsencrypt/live/anasserekysy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anasserekysy.com/privkey.pem;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $showtracker_client http://showtracker-client-1:80;

    location / {
        proxy_pass $showtracker_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name api-showtracker.anasserekysy.com;

    ssl_certificate /etc/letsencrypt/live/anasserekysy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anasserekysy.com/privkey.pem;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $showtracker_api http://showtracker-api-1:4000;

    location / {
        proxy_pass $showtracker_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
