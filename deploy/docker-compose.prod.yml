# ShowTracker production stack on the OVH VM.
# Project name, service names and volume names match the previous setup, so the
# containers keep their names (showtracker-*-1) and the existing database volume is reused.
name: showtracker

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: movies
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d movies"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  api:
    image: ghcr.io/anasserekysy/showtracker-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/movies?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${API_BIND:-0.0.0.0}:4000:4000"
    # Only on the stack's own network, under a unique name: several stacks on the shared
    # "web" network have a service called "api", so the bare name would be ambiguous there.
    networks:
      default:
        aliases: [showtracker-api]

  client:
    image: ghcr.io/anasserekysy/showtracker-client:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${CLIENT_BIND:-0.0.0.0}:8080:80"
    networks: [default, web]

volumes:
  db-data:
  redis-data:

networks:
  web:
    # Shared network of the VM's reverse-proxy container
    external: true
