name: CI/CD - Test, build, push to GHCR and deploy to OVH

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: showtracker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API - build and unit tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test -- --ci

  schema-upgrade:
    name: Database upgrade keeps existing data
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: movies }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/movies?schema=public
      PGPASSWORD: postgres
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - name: Create the previous schema with data in it
        run: |
          for f in prisma/migrations/*/migration.sql; do psql -h localhost -U postgres -d movies -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -h localhost -U postgres -d movies -v ON_ERROR_STOP=1 -c "INSERT INTO \"User\"(id,email,\"passwordHash\",\"updatedAt\") VALUES ('u1','old@test.com','x',now());"
          psql -h localhost -U postgres -d movies -v ON_ERROR_STOP=1 -c "INSERT INTO \"WatchlistItem\"(id,\"userId\",\"mediaType\",\"tmdbId\",title) VALUES ('w1','u1','movie',550,'Fight Club');"
      - name: Apply the new schema exactly like the container does (no --accept-data-loss)
        run: npx prisma db push --skip-generate
      - name: Existing rows are still there
        run: |
          test "$(psql -h localhost -U postgres -d movies -tAc "select count(*) from \"WatchlistItem\" where id='w1' and \"updatedAt\" is not null")" = "1"
          test "$(psql -h localhost -U postgres -d movies -tAc "select count(*) from \"User\" where id='u1'")" = "1"
          psql -h localhost -U postgres -d movies -tAc 'select count(*) from "EpisodeWatch"'

  client:
    name: Client - build and end-to-end tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
      - run: npx ng build --configuration production
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: client/playwright-report, retention-days: 7 }

  images:
    name: Docker images
    needs: [api, schema-upgrade, client]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        name: [api, client]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.name == 'api' && './server' || './client' }}
          push: true
          tags: |
            ghcr.io/anasserekysy/showtracker-${{ matrix.name }}:latest
            ghcr.io/anasserekysy/showtracker-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to OVH
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy deployment files to the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy/docker-compose.prod.yml,deploy/deploy.sh
          target: showtracker
          strip_components: 1
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          API_BIND: ${{ vars.SHOWTRACKER_API_BIND }}
          CLIENT_BIND: ${{ vars.SHOWTRACKER_CLIENT_BIND }}
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,POSTGRES_PASSWORD,TMDB_API_KEY,TMDB_ACCESS_TOKEN,JWT_ACCESS_SECRET,JWT_REFRESH_SECRET,API_BIND,CLIENT_BIND
          command_timeout: 15m
          script: |
            chmod +x ~/showtracker/deploy.sh
            ~/showtracker/deploy.sh
